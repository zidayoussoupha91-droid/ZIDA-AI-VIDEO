<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIDA AI VIDÉO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    header {
      background: #101722;
      padding: 25px 18px;
      text-align: center;
      border-bottom: 1px solid #263244;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      color: #4da3ff;
    }

    header p {
      margin: 8px 0 0;
      color: #aeb8c7;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 30px auto;
    }

    .card {
      background: #101722;
      border: 1px solid #263244;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #344154;
      background: #080b12;
      color: white;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #4da3ff;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #resultat {
      margin-top: 20px;
      text-align: center;
      color: #c9d2df;
      line-height: 1.5;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 14px;
      background: black;
    }

    .success {
      color: #43e878;
    }

    .error {
      color: #ff5d5d;
    }

    .loading {
      color: #ffd34d;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #718096;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 ZIDA AI VIDÉO</h1>
    <p>Crée tes vidéos avec l'intelligence artificielle</p>
  </header>

  <main class="container">

    <div class="card">
      <label for="prompt">
        ✍️ Décris la vidéo que tu veux créer
      </label>

      <textarea
        id="prompt"
        placeholder="Exemple : Un homme marche dans une grande ville la nuit, avec des lumières et une ambiance cinématographique..."
      ></textarea>

      <button onclick="genererVideo()">
        🚀 Générer la vidéo
      </button>

      <div id="resultat"></div>
    </div>

    <div class="card">
      <h2>✨ Comment ça marche ?</h2>

      <p>1️⃣ Écris ce que tu veux voir dans la vidéo.</p>
      <p>2️⃣ Appuie sur « Générer la vidéo ».</p>
      <p>3️⃣ Attends la génération.</p>
      <p>4️⃣ Ta vidéo apparaîtra ici.</p>
    </div>

  </main>

  <footer>
    © 2026 ZIDA AI VIDÉO
  </footer>

  <script>
    async function genererVideo() {

      const prompt = document.getElementById("prompt").value.trim();
      const resultat = document.getElementById("resultat");

      if (!prompt) {
        resultat.innerHTML =
          '<p class="error">❌ Écris d’abord une description.</p>';
        return;
      }

      resultat.innerHTML =
        '<p class="loading">⏳ Génération de la vidéo en cours...</p>';

      /*
        IMPORTANT :
        Cette partie est l'endroit où ton API de génération
        de vidéo devra être connectée.

        Exemple :

        const response = await fetch("TON_API", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt
          })
        });

      */

    const resultat = document.getElementById("resultat");

resultat.innerHTML = "<p>🎬 Génération de ta vidéo en cours...</p>";

try {
  const reponse = await fetch(
    "https://zida-ai-video.zidayoussoupha91.workers.dev",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    }
  );

  const data = await reponse.json();

  if (!reponse.ok || !data.success) {
    throw new Error(data.error || "La génération vidéo a échoué.");
  }

  resultat.innerHTML = `
    <p class="success">✅ Vidéo générée avec succès !</p>
    <video
      controls
      playsinline
      style="width:100%;max-width:700px;border-radius:16px;margin-top:15px;"
      src="${data.video}">
    </video>
    <p style="margin-top:15px;">
      <a
        href="${data.video}"
        target="_blank"
        rel="noopener">
        📥 Ouvrir la vidéo
      </a>
    </p>
  `;

} catch (error) {
  resultat.innerHTML = `
    <p style="color:#ff6b6b;">
      ❌ Erreur : ${error.message}
    </p>
  `;
}


      }, 1500);
    }
  </script>

</body>
</html>
